[package]
name = "cherrypi-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["render"]
# web_fetch's render option, which renders pages in Servo via servo-fetch.
# Without it cherrypi builds without Servo and render requests return an error.
render = ["dep:servo-fetch"]

[dependencies]
cherrypi-core = { path = "../core" }
cherrypi-llm = { path = "../llm" }
cherrypi-plugins = { path = "../plugins" }
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
encoding_rs = "0.8"
servo-fetch = { path = "../servo-fetch", default-features = false, optional = true }
url = "2"
thiserror.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
async-trait = "0.1"
dirs.workspace = true
fff-search.workspace = true
git2 = "0.20"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
