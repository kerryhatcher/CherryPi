[package]
name = "servo-fetch"
description = "Render JavaScript-heavy web pages in Servo and return their visible text, as a library or a CLI"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["cli"]
# The `servo-fetch` command-line tool. Library users can turn it off.
cli = ["dep:clap", "dep:serde", "dep:serde_json", "dep:tracing-subscriber"]

[[bin]]
name = "servo-fetch"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
servo = "=0.8.0"
rustls = "0.23"
url = "2"
dpi = "0.1"
cookie = "0.18"
content-security-policy = "0.9"
reqwest.workspace = true
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
clap = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
