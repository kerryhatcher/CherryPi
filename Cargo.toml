[workspace]
resolver = "2"
members = [
    "cherrypi",
    "crates/core",
    "crates/tui",
    "crates/llm",
    "crates/plugins",
    "crates/agent",
    "crates/servo-fetch",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["CherryPi Contributors"]
repository = "https://github.com/cherrypi/cherrypi"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Error handling
thiserror = "2"
anyhow = "1"
miette = "7"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# CLI
clap = { version = "4", features = ["derive"] }

# TUI
ratatui = "0.29"
crossterm = "0.28"
tui-textarea = "0.7"

# HTTP client
reqwest = { version = "0.12", features = ["json", "stream"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Glob
glob = "0.3"

# Regex
regex = "1"
lazy_static = "1"

# Chrono
chrono = { version = "0.4", features = ["serde"] }

# Dir paths
dirs = "5"

# FFF file-search index (long-lived, resident in-process).
# Not published to crates.io; pin to a release tag.
fff-search = { git = "https://github.com/dmtrKovalenko/fff.git", tag = "v0.10.1" }
